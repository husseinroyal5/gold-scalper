<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gold Scalper Login</title>

<style>

body{
    margin:0;
    background:#0d1117;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{

    width:360px;
    background:#161b22;
    border-radius:12px;
    padding:30px;
    text-align:center;
    color:white;

}

h1{

    color:#FFD700;

}

input{

    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:8px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    margin-top:20px;
    background:#FFD700;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}

#error{

    color:#ff5555;
    margin-top:15px;

}

</style>

</head>

<body>

<div class="box">

<h1>Gold Scalper</h1>

<p>أدخل كود الاشتراك</p>

<input
id="license"
placeholder="ROYAL-XXXX-XXXX"
/>

<button onclick="login()">

دخول

</button>

<div id="error"></div>

</div>

<script>

async function login(){

const key=document
.getElementById("license")
.value;

const res=await fetch("/api/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({key})

});

const data=await res.json();

if(data.success){

location="/";

}else{

document.getElementById("error")
.innerText=data.message;

}

}

</script>

</body>

</html>
